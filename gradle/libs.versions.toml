# ============================================================================
# CATÁLOGO DE VERSÕES - Aguia Branca Challenge
# ============================================================================
# Conforme material FIAP 05A (Navegação), o libs.versions.toml centraliza
# todas as versões das bibliotecas para evitar inconsistências e facilitar
# atualizações em um único lugar.
# ============================================================================

[versions]
# Android & Kotlin
agp = "8.5.0"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.21"

# AndroidX Core
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.2"
activityCompose = "1.9.0"

# Jetpack Compose (BOM gerencia versões consistentes)
composeBom = "2024.12.01"

# Navigation Compose - Material FIAP 05A
# Permite navegação entre telas usando rotas type-safe
navigationCompose = "2.7.7"

# Room Database - Material FIAP 07A
# Abstração sobre SQLite para persistência local
roomRuntime = "2.6.1"

# Hilt - Injeção de Dependências
# Facilita a conexão entre ViewModel e Repository
hiltAndroid = "2.51.1"
hiltNavigationCompose = "1.2.0"

# Coroutines - Programação assíncrona
# Material FIAP 10A: Flow para reatividade
coroutines = "1.8.1"

# Retrofit - API REST (Sprint 2)
retrofit = "2.11.0"
okhttp = "4.12.0"

# Serialization - Conversão JSON
kotlinxSerializationJson = "1.6.3"

# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
turbine = "1.1.0"

[libraries]
# ---- AndroidX Core ----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Jetpack Compose (via BOM) ----
# O BOM (Bill of Materials) garante versões compatíveis de todos os componentes Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ---- Navigation Compose (Material FIAP 05A) ----
# Permite navegação entre telas usando NavHost e NavController
# Conceitos: startDestination, composable routes, passagem de parâmetros
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ---- Room Database (Material FIAP 07A) ----
# Room é uma camada de abstração sobre SQLite que facilita:
# - Definição de entidades com @Entity
# - Operações CRUD com @Dao
# - Queries type-safe
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomRuntime" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomRuntime" }

# ---- Hilt (Dependency Injection) ----
# Simplifica a injeção de dependências no Android
# Conecta ViewModel com Repository automaticamente
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hiltAndroid" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hiltAndroid" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ---- Coroutines (Material FIAP 10A) ----
# Programação assíncrona para não bloquear a Main Thread
# Flow: fluxo de dados reativo que atualiza a UI automaticamente
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- Retrofit & OkHttp (Sprint 2 - API REST) ----
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ---- Serialization ----
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# ---- Testing ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
