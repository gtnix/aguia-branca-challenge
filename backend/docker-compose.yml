services:
  mongodb:
    image: mongo:7
    container_name: inovagab-mongodb
    ports:
      - "27017:27017"
    volumes:
      - inovagab_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inovagab_mongo_data:
