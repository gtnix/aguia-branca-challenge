spring:
  application:
    name: inovagab-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/inovagab}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

inovagab:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production-min-32-chars!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
